name: CI

on:
  push:
  pull_request:

jobs:
  typecheck-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
          cache: true
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  worker-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
          cache: true
      - run: bun install --frozen-lockfile
      - run: bun run test:worker

  visual-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
          cache: true
      - run: bun install --frozen-lockfile
      - run: bun run test:visual

  clean-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
          cache: true
      - run: bun install --frozen-lockfile
      - run: bun run test:package

  bundle-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
          cache: true
      - run: bun install --frozen-lockfile
      - run: bun run check:bundle
